<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Personal portfolio website showcasing experience, projects, skills, and blog"
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:title" content="Portfolio" />
    <meta property="og:description" content="Personal portfolio website" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:image" content="" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Portfolio" />
    <meta name="twitter:description" content="Personal portfolio website" />
    <link rel="canonical" href="%VITE_SITE_URL%" />
    <link rel="alternate" type="application/rss+xml" title="Blog RSS" href="/rss.xml" />
    <title>Portfolio</title>
    <script>
      (function () {
        var STORAGE_KEY = 'portfolio-theme-preference';
        var stored = null;
        try {
          stored = localStorage.getItem(STORAGE_KEY);
        } catch (e) {
          stored = null;
        }
        var preference = (stored === 'light' || stored === 'dark' || stored === 'system')
          ? stored
          : 'system';
        var theme = preference;
        if (preference === 'system') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

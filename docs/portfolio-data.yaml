    - slug: 'postgresql-vs-mongodb'
      title: 'PostgreSQL vs MongoDB: Choosing the Right Database'
      excerpt: 'A practical comparison of PostgreSQL and MongoDB for modern web applications, covering query patterns, scalability, and operational complexity.'
      content: |
        # PostgreSQL vs MongoDB: Choosing the Right Database

        The choice between PostgreSQL and MongoDB is one of the most
        consequential decisions in system design. This article compares
        both databases across several dimensions to help you make an
        informed decision.

        ## Data Model

        **PostgreSQL** is a relational database with a fixed schema.
        Tables have columns with defined types, and relationships are
        expressed through foreign keys.

        **MongoDB** is a document database with a flexible schema.
        Documents in a collection can have different shapes, which is
        useful for evolving data models.

        ## Query Language

        **PostgreSQL** uses SQL, a declarative language with decades of
        optimization. Complex queries with joins, aggregations, and
        window functions are straightforward.

        **MongoDB** uses a JSON-like query API. Queries are expressed as
        objects, which can be more intuitive for developers already
        familiar with JavaScript.

        ### Example: Top 10 Authors by Book Count

        **PostgreSQL:**

        ```sql
        SELECT a.name, COUNT(b.id) as book_count
        FROM authors a
        JOIN books b ON b.author_id = a.id
        GROUP BY a.id
        ORDER BY book_count DESC
        LIMIT 10;
        ```

        **MongoDB:**

        ```javascript
        db.authors.aggregate([
          { $lookup: {
              from: 'books',
              localField: '_id',
              foreignField: 'authorId',
              as: 'books'
          }},
          { $project: {
              name: 1,
              bookCount: { $size: '$books' }
          }},
          { $sort: { bookCount: -1 }},
          { $limit: 10 }
        ]);
        ```

        For this query, PostgreSQL's SQL is more concise and performant.

        ## Transactions

        **PostgreSQL** has full ACID transaction support, including
        multi-statement transactions.

        **MongoDB** added multi-document transactions in version 4.0,
        but they come with a performance penalty and are not as mature.

        ## Scalability

        **PostgreSQL** scales vertically (bigger server) and horizontally
        via sharding (Citus, TimescaleDB).

        **MongoDB** has built-in horizontal sharding, making it easier
        to scale across multiple nodes.

        ## When to Choose Which

        Choose **PostgreSQL** when:

        - Data has a well-defined structure
        - Complex queries with joins are required
        - ACID transactions are important
        - Read-heavy workload with analytical queries

        Choose **MongoDB** when:

        - The schema evolves frequently
        - Horizontal scaling is a primary concern
        - The data model is hierarchical (documents with nested arrays)
        - Development speed is prioritized over query flexibility

        ## Hybrid Approach

        In many applications, the best approach is to use **both**:

        - PostgreSQL for structured, relational data (users, orders, etc.)
        - MongoDB for flexible, document-oriented data (logs, events, etc.)

        The key is to match the database to the specific use case rather
        than applying a one-size-fits-all approach.

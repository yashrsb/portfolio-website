  posts:
    - slug: 'building-a-real-time-leaderboard'
      title: 'Building a Real-Time Leaderboard with Redis and PostgreSQL'
      excerpt: 'How to design and implement a scalable real-time leaderboard using Redis for fast writes and PostgreSQL for persistence, with Node.js.'
      content: |
        # Building a Real-Time Leaderboard with Redis and PostgreSQL

        This article walks through the architecture and implementation of a
        real-time leaderboard service, built with Node.js, Redis, and
        PostgreSQL. The leaderboard must handle thousands of score updates
        per second while providing low-latency reads for the top-N rankings.

        ## Problem Statement

        A gaming platform needs a leaderboard that updates in real time as
        players earn points. The read pattern is dominated by "top 10" and
        "top 100" queries, while writes are individual score submissions.

        ## Architecture Overview

        ```
        Client → API Gateway → Node.js Service → Redis (writes)
                                          ↓
                                    PostgreSQL (persistence)
        ```

        We use Redis as the primary store for live scores (in-memory sorted
        sets) and PostgreSQL as the durable store for score history.

        ## Redis Sorted Sets

        Redis sorted sets are the perfect data structure for a leaderboard.
        Each player's score is stored as a member of a sorted set with the
        score as the ZSET member value:

        ```javascript
        await redis.zadd('leaderboard', score, playerId);
        ```

        Retrieving the top N players is a single `ZRANGE` call:

        ```javascript
        const top = await redis.zrevrange('leaderboard', 0, 9, 'WITHSCORES');
        ```

        ## PostgreSQL Persistence

        Every score update is also written to PostgreSQL for durability:

        ```sql
        INSERT INTO score_events (player_id, score, created_at)
        VALUES ($1, $2, NOW());
        ```

        A background job periodically flushes Redis to PostgreSQL and
        rebuilds the sorted set from the database on startup.

        ## Performance Results

        With this architecture we achieved:

        - 99th percentile latency under 10ms for top-100 reads
        - 50,000+ writes per second on a single Redis instance
        - < 1ms latency for individual score submissions

        ## Lessons Learned

        - Redis sorted sets are ideal for ranking use cases
        - Always treat Redis as a cache in front of PostgreSQL
        - Batch write-through for persistence to avoid write amplification

      excerpt: 'Step-by-step guide to containerizing a Node.js application with Docker, including multi-stage builds, production optimization, and Docker Compose.'
      content: |
        # Dockerizing a Node.js Application: A Practical Guide

        Containerization is essential for modern deployment. This guide
        walks through Dockerizing a Node.js application with best practices
        for production.

        ## Project Structure

        ```
        app/
          src/
          Dockerfile
          .dockerignore
          docker-compose.yml
        ```

        ## Multi-Stage Dockerfile

        Using multi-stage builds keeps the final image small:

        ```dockerfile
        # Build stage
        FROM node:20-alpine AS builder
        WORKDIR /app
        COPY package*.json ./
        RUN npm ci --only=production
        COPY . .

        # Production stage
        FROM node:20-alpine
        WORKDIR /app
        COPY --from=builder /app/node_modules ./node_modules
        COPY --from=builder /app/src ./src
        EXPOSE 3000
        CMD ["node", "src/index.js"]
        ```

        ## .dockerignore

        Keep the image lean by ignoring development files:

        ```
        node_modules
        npm-debug.log
        Dockerfile
        docker-compose.yml
        .git
        .gitignore
        README.md
        ```

        ## Docker Compose

        For local development with dependencies:

        ```yaml
        version: '3.8'

        services:
          app:
            build: .
            ports:
              - '3000:3000'
            environment:
              - DATABASE_URL=postgresql://postgres:postgres@db:5432/app
            depends_on:
              - db
            volumes:
              - .:/app
              - /app/node_modules

          db:
            image: postgres:16-alpine
            environment:
              POSTGRES_PASSWORD: postgres
              POSTGRES_DB: app
            ports:
              - '5432:5432'
            volumes:
              - postgres_data:/var/lib/postgresql/data

        volumes:
          postgres_data:
        ```

        ## Production Considerations

        1. **Never run as root** — add `USER node` to the Dockerfile
        2. **Use specific node versions** — pin to `node:20.11.1-alpine`
        3. **Health checks** — add a `/health` endpoint and Docker HEALTHCHECK
        4. **Environment variables** — use `.env` files, never hardcode
        5. **Log to stdout/stderr** — don't log to files inside the container

        ## Kubernetes Deployment

        For production scaling, deploy to Kubernetes with a Helm chart:

        ```yaml
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: node-app
        spec:
          replicas: 3
          selector:
            matchLabels:
              app: node-app
          template:
            metadata:
              labels:
                app: node-app
            spec:
              containers:
                - name: app
                  image: node-app:1.0.0
                  ports:
                    - containerPort: 3000
                  readinessProbe:
                    httpGet:
                      path: /health
                      port: 3000
                    initialDelaySeconds: 5
                    periodSeconds: 10
        ```

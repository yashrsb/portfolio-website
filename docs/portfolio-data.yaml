projects:
  - slug: 'portfolio-website'
    title: 'Personal Portfolio Website'
    description: 'A production-ready personal portfolio website built with React, Express, and PostgreSQL. Features a public frontend, REST API, admin dashboard, and Markdown-based content import system.'
    summary: 'Full-stack portfolio with admin dashboard and content import from YAML'
    status: 'live'
    featured: true
    tags:
      - React
      - Node.js
      - Express
      - PostgreSQL
      - Prisma
      - Docker
    features:
      - 'Three-tier deployment: public React frontend, Express API backend, and React-based admin dashboard'
      - 'YAML-driven content import pipeline with validation and normalization'
      - 'Admin dashboard with full CRUD for all portfolio entities (projects, skills, experience, education)'
      - 'Optimistic UI updates with automatic rollback on error'
      - 'Responsive design with CSS Modules and mobile-first approach'
      - 'Accessibility-first components with keyboard navigation and ARIA labels'
    techStack:
      Frontend:
        - React
        - Vite
        - CSS Modules
        - React Router
      Backend:
        - Node.js
        - Express
        - Prisma ORM
      Database:
        - PostgreSQL (Neon)
      Infrastructure:
        - Docker
        - Redis
      Testing:
        - Vitest
        - Testing Library
      Observability:
        - Sentry
        - LogRocket (planned)
    architecture: 'Client (React + Vite) makes HTTP requests to the Express API. The API delegates to a service layer, which calls repository methods that query PostgreSQL via Prisma. Data is imported from YAML through a CLI pipeline (parser → validator → normalizer → importer). The admin panel is a separate React app behind JWT-based authentication, consuming the same API through protected `/admin/*` routes.'
    architectureImage: null
    challenges:
      - 'Designing a content import pipeline that validates, normalizes, and safely upserts YAML data into PostgreSQL without breaking existing records'
      - 'Implementing real-time admin table updates with optimistic UI without a state management library'
      - 'Ensuring the public frontend gracefully handles API failures with proper loading, error, and empty states'
    lessonsLearned:
      - 'Layered architecture (API → Service → Repository → Prisma) keeps business logic decoupled from HTTP concerns and makes testing tractable'
      - 'CSS Modules with a consistent naming convention eliminates style leakage across components in a multi-app monorepo'
      - 'A standardized API response envelope (`{ success, message, data, meta }`) simplifies client-side error handling across all endpoints'
    screenshots:
      - src: 'https://res.cloudinary.com/ig4t42rr/image/upload/f_auto,q_auto/portfolio-showcase_zlahxv'
        alt: 'Portfolio website project detail page'
        caption: 'The project showcase detail page with architecture section and screenshot gallery'
      - src: 'https://res.cloudinary.com/ig4t42rr/image/upload/f_auto,q_auto/portfolio-admin_ajkwer'
        alt: 'Admin dashboard projects table'
        caption: 'Admin dashboard with full CRUD and reorder support for portfolio projects'

  - slug: 'auto-assignment-engine'
    title: 'Automated Trip Assignment Engine'
    description: 'Scalable backend system for automated trip assignment in transportation and ride-sharing platforms. Replaced legacy SQL Server Agent jobs with a queue-based microservice architecture.'
    summary: 'High-throughput trip assignment system for transportation platforms'
    status: 'live'
    featured: true
    tags:
      - Node.js
      - TypeScript
      - SQL Server
      - Kafka
      - gRPC
      - AWS
    features:
      - 'Replaced legacy SQL Server Agent jobs with a scalable queue-based microservice for trip assignment'
      - 'Fraud, Waste, and Abuse (FWA) safeguards integrated into the auto-assignment engine'
      - 'Kafka-based message delivery for vendor reservation updates'
      - 'gRPC for low-latency read requests from the main API'
    techStack:
      Backend:
        - Node.js
        - TypeScript
      Databases:
        - SQL Server
        - PostgreSQL
      Messaging:
        - Apache Kafka
      RPC:
        - gRPC
      Infrastructure:
        - AWS
      Observability:
        - OpenTelemetry
        - Zipkin
    architecture: 'A Kafka consumer service polls trip data from a message topic. The assignment engine queries SQL Server to determine eligible trips, applies FWA rules, and assigns trips to drivers. Results are published back via Kafka. A gRPC service provides low-latency read access to assignment status for the main API layer.'
    challenges:
      - 'Migrating from SQL Server Agent jobs to a queue-based microservice without downtime during peak hours'
      - 'Implementing FWA safeguards that reduce policy violations by 70% without impacting assignment throughput'
      - 'Debugging a critical Kafka producer issue that prevented vendor reservation updates, causing 90% message delivery failures'
    lessonsLearned:
      - 'Queue-based processing scales better than scheduled SQL agents for variable workloads'
      - 'Decoupling assignment logic from the transport layer (SQL Server Agents) enabled seamless replacement with Kafka'
      - 'OTel instrumentation was invaluable for diagnosing the Kafka producer failure — it surfaced a serialization mismatch that would have been invisible without distributed tracing'


    - slug: 'building-a-production-ready-node-api'
      title: 'Building a Production-Ready Node.js API'
      excerpt: 'A comprehensive guide to building a robust, secure, and scalable REST API with Node.js, Express, PostgreSQL, and Prisma.'
      content: |
        # Building a Production-Ready Node.js API

        This guide covers the essential practices for building a production-ready
        REST API with Node.js, Express, PostgreSQL, and Prisma. It is based on
        real-world experience running APIs that serve thousands of requests
        per second.

        ## Project Structure

        We use a layered architecture that separates concerns:

        ```
        src/
          config/         # Environment and configuration
          controllers/     # HTTP request handlers
          services/       # Business logic
          repositories/   # Data access (Prisma queries)
          routes/         # Express router definitions
          middlewares/    # Auth, validation, error handling
          utils/          # Helpers (logger, ApiResponse, etc.)
          validators/     # express-validator rule chains
          lib/            # Prisma client instance
        ```

        Each layer has a single responsibility. Controllers are thin — they
        delegate to services, which delegate to repositories. This makes
        testing straightforward.

        ## Error Handling

        We use a centralized error handler that catches errors at the end
        of the middleware chain:

        ```javascript
        app.use(errorHandler);
        ```

        The `errorHandler` middleware formats errors into a consistent
        JSON response:

        ```json
        {
          "success": false,
          "message": "Validation failed",
          "errors": [
            { "field": "email", "message": "Invalid email" }
          ]
        }
        ```

        ## Input Validation

        All routes use express-validator to validate request data:

        ```javascript
        router.post(
          '/users',
          userValidators.create,
          validateRequest,
          createUserHandler,
        );
        ```

        This chain ensures that invalid data never reaches the controller.

        ## Rate Limiting

        We apply rate limiting at two levels:

        1. Global — `express-rate-limit` with 100 requests per 15 minutes
           per IP.
        2. Resource-specific — e.g., contact form limited to 5 submissions
           per 15 minutes per IP.

        ## Logging

        We use a structured logger (Pino) that writes JSON logs:

        ```json
        {
          "level": 30,
          "time": 1710000000000,
          "pid": 12345,
          "hostname": "api-server",
          "msg": "GET /api/v1/projects 200 12ms"
        }
        ```

        ## Security

        Key security measures:

        - **Helmet** for security headers (CSP, HSTS, X-Frame-Options)
        - **CORS** restricted to known origins
        - **JWT** access tokens (15min TTL) with refresh token rotation
        - **Cookie-based** refresh tokens (httpOnly, SameSite=Lax)
        - **Input sanitization** via express-validator and xss-clean
        - **Password hashing** with bcrypt (12 rounds)

        ## Database Migrations

        We use Prisma Migrate for schema management. Every schema change
        goes through a migration file, never `db push` in production.

        ## Health Checks

        A `/health` endpoint returns service status:

        ```javascript
        router.get('/health', (req, res) => {
          new ApiResponse(200, 'OK', { status: 'healthy' }).send(res);
        });
        ```

        ## Monitoring

        We track key metrics:

        - Request latency (p50, p95, p99)
        - Error rate (4xx, 5xx)
        - Database query latency
        - External API call latency
